<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test before you commit: demo deck</title>
<style>
  :root { --bg: #05070b; --panel: #151b28; --line: #2a3345; --ink: #eef1f6; --ink2: #aab2c2; --muted: #7b869b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: "DejaVu Sans", Verdana, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  body.notes #stage { bottom: var(--notes-height, 190px); }
  .slide { display: none; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; object-fit: contain;
    cursor: pointer; user-select: none; }
  .slide.current { display: block; }
  #notes { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: var(--notes-height, 190px);
    background: var(--panel); border-top: 1px solid var(--line); padding: 16px 28px; overflow: auto; }
  body.notes #notes { display: block; }
  #notes .meta { color: var(--muted); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  #notes p { margin: 8px 0 0; font-size: 21px; line-height: 1.45; max-width: 70em; color: var(--ink); }
  #hud { position: fixed; top: 10px; right: 14px; font-size: 13px; color: var(--muted);
    background: rgba(5, 7, 11, .7); padding: 4px 10px; border-radius: 6px; opacity: 0; transition: opacity .2s; }
  body.hud #hud, body.playing #hud { opacity: 1; }
  #help { position: fixed; left: 14px; top: 10px; font-size: 13px; color: var(--muted);
    background: rgba(5, 7, 11, .7); padding: 4px 10px; border-radius: 6px; opacity: 0; transition: opacity .2s; }
  body.hud #help { opacity: 1; }
  @media print {
    html, body { overflow: visible; height: auto; background: #0d1119; }
    #stage { position: static; display: block; }
    .slide { display: block !important; width: 100%; page-break-after: always; }
    #notes, #hud, #help { display: none !important; }
    @page { size: 1920px 1080px; margin: 0; }
  }
</style>
</head>
<body>
  <main id="stage">
<!--SLIDES-->
  </main>
  <aside id="notes" aria-live="polite">
    <div class="meta" id="notes-meta"></div>
    <p id="notes-text"></p>
  </aside>
  <div id="help">← → move · n notes · t timed autoplay · f fullscreen</div>
  <div id="hud"></div>
<script>
  const SLIDES = /*SLIDE_DATA*/[];
  const images = Array.from(document.querySelectorAll(".slide"));
  let current = 0;
  let timer = null;
  let hudTimer = null;

  function startTime(index) {
    return SLIDES.slice(0, index).reduce((sum, slide) => sum + slide.seconds, 0);
  }

  function clock(seconds) {
    return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
  }

  function show(index) {
    current = Math.max(0, Math.min(images.length - 1, index));
    images.forEach((image, i) => image.classList.toggle("current", i === current));
    const slide = SLIDES[current];
    const start = startTime(current);
    document.getElementById("notes-meta").textContent =
      `Slide ${current + 1} of ${SLIDES.length} · ${slide.title} · ${clock(start)}–${clock(start + slide.seconds)} (${slide.seconds} s)`;
    document.getElementById("notes-text").textContent = slide.notes;
    document.getElementById("hud").textContent =
      `${current + 1} / ${SLIDES.length} · ${slide.seconds} s` + (timer ? " · autoplay" : "");
    history.replaceState(null, "", "#" + (current + 1));
    flashHud();
  }

  function flashHud() {
    document.body.classList.add("hud");
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => document.body.classList.remove("hud"), 1800);
  }

  function stopAutoplay() {
    clearTimeout(timer);
    timer = null;
    document.body.classList.remove("playing");
  }

  function scheduleNext() {
    timer = setTimeout(() => {
      if (current === images.length - 1) { stopAutoplay(); show(current); return; }
      show(current + 1);
      scheduleNext();
    }, SLIDES[current].seconds * 1000);
  }

  function toggleAutoplay() {
    if (timer) { stopAutoplay(); show(current); return; }
    document.body.classList.add("playing");
    scheduleNext();
    show(current);
  }

  document.addEventListener("keydown", (event) => {
    const key = event.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(key)) { stopAutoplay(); show(current + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(key)) { stopAutoplay(); show(current - 1); }
    else if (key === "Home") { stopAutoplay(); show(0); }
    else if (key === "End") { stopAutoplay(); show(images.length - 1); }
    else if (key === "n" || key === "N") { document.body.classList.toggle("notes"); }
    else if (key === "t" || key === "T") { toggleAutoplay(); }
    else if (key === "f" || key === "F") {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    } else return;
    event.preventDefault();
  });
  document.getElementById("stage").addEventListener("click", () => { stopAutoplay(); show(current + 1); });
  window.addEventListener("hashchange", () => show((parseInt(location.hash.slice(1), 10) || 1) - 1));
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
