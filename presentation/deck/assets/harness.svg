<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 560" width="1680" height="560" font-family="'DejaVu Sans', Verdana, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="head-aab2c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab2c2"/></marker><marker id="head-199e70" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#199e70"/></marker></defs>
<rect x="20" y="20" width="470" height="250" rx="14" fill="#151b28" stroke="#3987e5" stroke-width="2"/>
<text x="44.0" y="62.0" font-size="25" fill="#eef1f6" text-anchor="start" font-weight="700">Agent container</text>
<text x="44.0" y="98.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">Harbor runs OpenCode with the model</text>
<text x="44.0" y="128.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">sees the map, readings and traces</text>
<text x="44.0" y="158.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">no sim code, seed or hidden values</text>
<text x="44.0" y="188.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">has a shell (and uses it)</text>
<rect x="605" y="20" width="470" height="250" rx="14" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
<text x="629.0" y="62.0" font-size="25" fill="#eef1f6" text-anchor="start" font-weight="700">MCP tools</text>
<text x="629.0" y="98.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">get_map · observe · finish</text>
<text x="629.0" y="128.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">rover: drive_to · brake · wait</text>
<text x="629.0" y="158.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">hoist: move_trolley · winch · attach</text>
<text x="629.0" y="188.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">the only way to touch the simulator</text>
<rect x="1190" y="20" width="470" height="250" rx="14" fill="#151b28" stroke="#199e70" stroke-width="2"/>
<text x="1214.0" y="62.0" font-size="25" fill="#eef1f6" text-anchor="start" font-weight="700">Simulator sidecar</text>
<text x="1214.0" y="98.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">MuJoCo episode, hidden physics</text>
<text x="1214.0" y="128.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">time and energy budgets</text>
<text x="1214.0" y="158.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">reward from simulator state only:</text>
<text x="1214.0" y="188.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">0, or 0.5 + 0.5 × efficiency</text>
<line x1="492" y1="110" x2="603" y2="110" stroke="#aab2c2" stroke-width="3" marker-end="url(#head-aab2c2)"/>
<line x1="603" y1="180" x2="492" y2="180" stroke="#aab2c2" stroke-width="3" marker-end="url(#head-aab2c2)"/>
<line x1="1077" y1="110" x2="1188" y2="110" stroke="#aab2c2" stroke-width="3" marker-end="url(#head-aab2c2)"/>
<line x1="1188" y1="180" x2="1077" y2="180" stroke="#aab2c2" stroke-width="3" marker-end="url(#head-aab2c2)"/>
<text x="547.0" y="96.0" font-size="19" fill="#7b869b" text-anchor="middle" font-weight="400">calls</text>
<text x="547.0" y="212.0" font-size="19" fill="#7b869b" text-anchor="middle" font-weight="400">readings</text>
<rect x="1190" y="380" width="470" height="150" rx="14" fill="#151b28" stroke="#199e70" stroke-width="2"/>
<text x="1214.0" y="422.0" font-size="25" fill="#eef1f6" text-anchor="start" font-weight="700">result.json</text>
<text x="1214.0" y="458.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">written by the simulator, on finish</text>
<text x="1214.0" y="488.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">agent container mounts it read-only</text>
<line x1="1425" y1="272" x2="1425" y2="378" stroke="#199e70" stroke-width="3" marker-end="url(#head-199e70)"/>
<rect x="605" y="380" width="470" height="150" rx="14" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
<text x="629.0" y="422.0" font-size="25" fill="#eef1f6" text-anchor="start" font-weight="700">Harbor verifier</text>
<text x="629.0" y="458.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">reads the reward from the file;</text>
<text x="629.0" y="488.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">never asks the agent</text>
<line x1="1188" y1="455" x2="1077" y2="455" stroke="#199e70" stroke-width="3" marker-end="url(#head-199e70)"/>
<rect x="20" y="380" width="470" height="150" rx="14" fill="#151b28" stroke="#2a3345" stroke-width="2"/>
<text x="44.0" y="422.0" font-size="25" fill="#eef1f6" text-anchor="start" font-weight="700">Baselines</text>
<text x="44.0" y="458.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">do-nothing: 0 on all 75 tasks</text>
<text x="44.0" y="488.0" font-size="20" fill="#aab2c2" text-anchor="start" font-weight="400">stop-early: 0 on all 75 tasks</text>
</svg>
